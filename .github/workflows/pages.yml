name: Publish BriefHarbor demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --workspace @briefharbor/web --workspace @briefharbor/contracts --include-workspace-root
          else
            npm install --workspace @briefharbor/web --workspace @briefharbor/contracts --include-workspace-root
          fi
      - name: Build static demo
        run: npm run build:demo
        env:
          NEXT_PUBLIC_BRIEFHARBOR_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
